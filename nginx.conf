server {
    listen 8080;
    absolute_redirect off;
    port_in_redirect off;
    server_name localhost;
    root /usr/share/nginx/html;

    # Session token for BFF endpoint validation (set via environment variable)
    set $bf_session_token "${BF_SESSION_SECRET}";

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json application/x-javascript text/json;

    # Enable Brotli compression (if module available)
    brotli on;
    brotli_comp_level 6;
    brotli_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json application/x-javascript text/json;

    # Serve precompressed files if available
    gzip_static on;
    brotli_static on;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Serve static assets without SPA fallback to avoid HTML responses for JS chunks
    location ^~ /helpdesk/static/ {
        alias /usr/share/nginx/html/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        gzip_static on;
        brotli_static on;
    }

    # Helpdesk app at /helpdesk path
    location /helpdesk/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /helpdesk/index.html;

        # Set session cookie for BFF endpoint validation (only on HTML responses)
        if ($uri ~* \.html$|^/helpdesk/$) {
            add_header Set-Cookie "bf_session=$bf_session_token; Path=/helpdesk; HttpOnly; SameSite=Strict; Secure" always;
        }
    }

    location = /helpdesk {
        alias /usr/share/nginx/html/;
        try_files /index.html =404;
        add_header Set-Cookie "bf_session=$bf_session_token; Path=/helpdesk; HttpOnly; SameSite=Strict; Secure" always;
    }

    # BFF proxy - forward /helpdesk/edge/* to Node.js server
    # The app is mounted at /helpdesk, so BFF requests come to /helpdesk/edge/*
    location /helpdesk/edge/ {
        # Rewrite to remove /helpdesk prefix before forwarding to Node.js
        rewrite ^/helpdesk(/edge/.*)$ $1 break;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Pass expected session token for validation
        proxy_set_header X-Expected-Session $bf_session_token;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Disable access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
