server {
    listen 8080;
    absolute_redirect off;
    port_in_redirect off;
    server_name localhost;
    root /usr/share/nginx/html;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json application/x-javascript text/json;

    # Enable Brotli compression (if module available)
    brotli on;
    brotli_comp_level 6;
    brotli_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json application/x-javascript text/json;

    # Serve precompressed files if available
    gzip_static on;
    brotli_static on;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Serve static assets without SPA fallback to avoid HTML responses for JS chunks.
    # CORS is enabled because these chunks include the Module Federation remote
    # entry / exposed-module chunks consumed cross-app by the app shell
    # (helpdesk-mf exposes `./export-app`, mounted by the shell at /helpdesk).
    location ^~ /helpdesk/static/ {
        alias /usr/share/nginx/html/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
        gzip_static on;
        brotli_static on;
    }

    # Module Federation manifest — entry point for the app shell embedding
    # helpdesk-mf's exposed `./export-app`. NEVER cache the manifest: it
    # points at hashed chunk files that change every deploy. CORS enabled
    # for cross-app consumption.
    location = /helpdesk/mf-manifest.json {
        alias /usr/share/nginx/html/mf-manifest.json;
        default_type application/json;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
    }

    location = /helpdesk/mf-stats.json {
        alias /usr/share/nginx/html/mf-stats.json;
        default_type application/json;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header 'Access-Control-Allow-Origin' '*' always;
    }

    # Helpdesk app at /helpdesk path
    location /helpdesk/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /helpdesk/index.html;

        # SPA entry (index.html) and config.js must never be cached so
        # deploys are picked up immediately instead of served stale.
        add_header Cache-Control "no-cache" always;
    }

    location = /helpdesk {
        alias /usr/share/nginx/html/;
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Disable access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
