name: Build and Deploy Helpdesk MF

on:
  push:
    branches: [develop, main]
    paths-ignore:
      - 'e2e/**'
      - '*.md'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [develop, main]
    paths-ignore:
      - 'e2e/**'
      - '*.md'
  workflow_dispatch:

# One run per workflow and ref. A newer push to a PR branch cancels the run it
# supersedes; a push to develop/main never cancels a run in flight (a package
# publish or image push must not stop halfway) — the newest pending run simply
# replaces any older pending one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Build and Push
    uses: BrainForgeAU/.github/.github/workflows/docker-build.yml@main
    with:
      image_name: ${{ github.repository }}
      dockerfile_path: ./Dockerfile
    secrets: inherit

