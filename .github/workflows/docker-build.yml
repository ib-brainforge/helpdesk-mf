name: Build and Deploy Helpdesk MF

on:
  push:
    branches: [develop, main]
    paths-ignore:
      - 'e2e/**'
      - '*.md'
  pull_request:
    branches: [develop, main]
    paths-ignore:
      - 'e2e/**'
      - '*.md'
  workflow_dispatch:

jobs:
  pick-runner:
    uses: BrainForgeAU/.github/.github/workflows/pick-runner.yml@main
    secrets: inherit
  build:
    name: Build and Push
    needs: pick-runner
    uses: BrainForgeAU/.github/.github/workflows/docker-build.yml@main
    with:
      runner_label: ${{ needs.pick-runner.outputs.label }}
      image_name: ${{ github.repository }}
      dockerfile_path: ./Dockerfile
    secrets: inherit

