name: Build and Deploy Helpdesk MF

on:
  push:
    branches: [develop, main]
    paths-ignore:
      - 'e2e/**'
      - '*.md'
  pull_request:
    branches: [develop, main]
    paths-ignore:
      - 'e2e/**'
      - '*.md'
  workflow_dispatch:

jobs:
  build:
    name: Build and Push
    uses: BrainForgeAU/.github/.github/workflows/docker-build.yml@main
    with:
      image_name: ${{ github.repository }}
      dockerfile_path: ./Dockerfile
    secrets: inherit

