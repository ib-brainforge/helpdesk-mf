name: Build and Deploy Helpdesk MF

on:
  push:
    branches: [develop, main]
    paths-ignore:
      - 'e2e/**'
      - '*.md'
  pull_request:
    branches: [develop, main]
    paths-ignore:
      - 'e2e/**'
      - '*.md'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  VERSION_MAJOR: '0'
  VERSION_MINOR: '1'

jobs:
  # Build job - runs on ALL events (PRs and pushes)
  # This is a GATE - PRs cannot merge if build fails
  build:
    name: Build & Verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Configure npm for GitHub Packages
        run: |
          echo "" >> .npmrc && echo "@brainforgeau:registry=https://npm.pkg.github.com" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.PACKAGES_PAT_TOKEN }}" >> .npmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit || true

      - name: Build application
        run: pnpm run build
        env:
          NODE_ENV: production

      - name: Run tests
        run: pnpm test --passWithNoTests || true

  # Push job - only runs on push to develop/main (not PRs)
  push:
    name: Push to Registry
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate version
        id: version
        run: |
          # Extract and sanitize branch name
          BRANCH="${{ github.ref_name }}"
          BRANCH_SLUG=$(echo "$BRANCH" | sed 's/\//-/g' | sed 's/[^a-zA-Z0-9._-]//g')
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)

          # Convert image name to lowercase for Docker compatibility
          IMAGE_NAME_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')

          # Generate semantic version based on branch
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            VERSION="${{ env.VERSION_MAJOR }}.${{ env.VERSION_MINOR }}.${{ github.run_number }}"
          else
            VERSION="${{ env.VERSION_MAJOR }}.${{ env.VERSION_MINOR }}.${{ github.run_number }}-${BRANCH_SLUG}.${SHORT_SHA}"
          fi

          echo "branch=$BRANCH_SLUG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "image_name=$IMAGE_NAME_LOWER" >> $GITHUB_OUTPUT
          echo "mfs_url=https://app.brainforge.com.au/mfs/packages" >> $GITHUB_OUTPUT
          echo "Branch: $BRANCH_SLUG"
          echo "Version: $VERSION"
          echo "Image: $IMAGE_NAME_LOWER"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.version.outputs.image_name }}
          tags: |
            type=ref,event=branch
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          build-args: |
            NPM_TOKEN=${{ secrets.PACKAGES_PAT_TOKEN }}
            APP_VERSION=${{ steps.version.outputs.version }}

      - name: Update Flux deployment
        if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
        run: |
          git clone https://x-access-token:${{ secrets.INFRA_ORG_PAT_TOKEN }}@github.com/${{ github.repository_owner }}/infra.git
          cd infra

          IMAGE_TAG="${{ steps.version.outputs.image_name }}:${{ steps.version.outputs.version }}"
          echo "Selected tag: $IMAGE_TAG"

          sed -i "s|image: ghcr.io/[Bb]rain[Ff]orge[Aa][Uu]/helpdesk-mf:[^[:space:]]*|image: $IMAGE_TAG|g" namespaces/brainforge/deployments/helpdesk-mf.yaml

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add namespaces/brainforge/deployments/helpdesk-mf.yaml
          git commit -m "Update helpdesk-mf image to ${{ steps.version.outputs.version }} [skip ci]" || echo "No changes to commit"
          git push origin main || echo "No changes to push"

      - name: Output image info
        run: |
          echo "Image: ${{ steps.version.outputs.image_name }}"
          echo "Version: ${{ steps.version.outputs.version }}"
          echo "Tags: ${{ steps.meta.outputs.tags }}"
