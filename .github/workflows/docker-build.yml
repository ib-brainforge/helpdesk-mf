name: Build and Deploy Helpdesk MF

on:
  push:
    branches: [develop, main]
    paths-ignore:
      - 'e2e/**'
      - '*.md'
  pull_request:
    branches: [develop, main]
    paths-ignore:
      - 'e2e/**'
      - '*.md'
  workflow_dispatch:

jobs:
  build:
    name: Build and Push
    uses: BrainForgeAU/.github/.github/workflows/docker-build.yml@main
    with:
      image_name: ${{ github.repository }}
      dockerfile_path: ./Dockerfile
    secrets: inherit

  deploy-dev:
    name: Deploy to Dev
    needs: build
    if: github.ref == 'refs/heads/develop' && github.event_name != 'pull_request'
    uses: BrainForgeAU/.github/.github/workflows/deploy-to-flux.yml@main
    with:
      environment_name: development
      image_tag: ${{ needs.build.outputs.image_tag }}
    secrets: inherit
