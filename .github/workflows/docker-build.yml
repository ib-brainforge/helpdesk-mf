name: Build and Deploy Helpdesk MF

on:
  push:
    branches: [develop, main]
    paths-ignore:
      - 'e2e/**'
      - '*.md'
  pull_request:
    branches: [develop, main]
    paths-ignore:
      - 'e2e/**'
      - '*.md'
  workflow_dispatch:

# One run per workflow and ref. A newer push to a PR branch cancels the run it
# supersedes; a push to develop/main never cancels a run in flight (a package
# publish or image push must not stop halfway) — the newest pending run simply
# replaces any older pending one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pick-runner:
    uses: BrainForgeAU/.github/.github/workflows/pick-runner.yml@main
    secrets: inherit
  build:
    name: Build and Push
    needs: pick-runner
    uses: BrainForgeAU/.github/.github/workflows/docker-build.yml@main
    with:
      runner_label: ${{ needs.pick-runner.outputs.label }}
      image_name: ${{ github.repository }}
      dockerfile_path: ./Dockerfile
    secrets: inherit

