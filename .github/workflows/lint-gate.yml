name: Lint Gate

# Hard Gate #3 enforcement + fleet code hygiene.
# Runs `biome ci` (format + lint + import organization) on every PR.
# The lint rules include the raw fetch()/axios ban (style/noRestrictedGlobals,
# nursery/noRestrictedImports) — see .claude/knowledge/validation/frontend-patterns.md.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [develop, main]

# One run per workflow and ref. A newer push to a PR branch cancels the run it
# supersedes; a push to develop/main never cancels a run in flight (a package
# publish or image push must not stop halfway) — the newest pending run simply
# replaces any older pending one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pick-runner:
    uses: BrainForgeAU/.github/.github/workflows/pick-runner.yml@main
    secrets: inherit
  biome:
    name: Biome CI (format + lint)
    needs: pick-runner
    runs-on: ${{ needs.pick-runner.outputs.label }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Biome is a standalone binary — no pnpm install / node_modules needed.
      # Version pinned to match the biome.json schema fleet-wide.
      - name: Run Biome
        run: npx --yes @biomejs/biome@1.9.4 ci .
