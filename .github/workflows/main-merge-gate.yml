name: Main Branch Merge Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

# One run per workflow and ref. A newer push to a PR branch cancels the run it
# supersedes; a push to develop/main never cancels a run in flight (a package
# publish or image push must not stop halfway) — the newest pending run simply
# replaces any older pending one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-source-branch:
    if: (github.base_ref == 'main') && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ${{ vars.RUNNER_TARGET || 'ubuntu-latest' }}
    steps:
      - name: Verify source branch
        run: |
          SOURCE="${{ github.head_ref }}"
          if [[ "$SOURCE" == "develop" || "$SOURCE" == hotfix/* ]]; then
            echo "Allowed: merging $SOURCE → main"
          else
            echo "BLOCKED: Only 'develop' and 'hotfix/*' branches can merge to main."
            echo "Source branch: $SOURCE"
            exit 1
          fi
